name: Withdraw 0.5.5 and restore stable release
on:
  push:
    branches: [main]
    paths: [.github/workflows/withdraw-0.5.5.yml]
permissions:
  contents: read
jobs:
  withdraw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove explicitly withdrawn release and its tag
        shell: bash
        run: |
          gh release delete v0.5.5 --cleanup-tag --yes
          gh release edit v0.5.4 --latest
      - name: Verify stable release and removal
        shell: bash
        run: |
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          test "$latest" = "v0.5.4"
          releases="$(gh api "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if printf '%s\n' "$releases" | grep -Fxq 'v0.5.5'; then
            echo "Withdrawn release still exists"
            exit 1
          fi
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v0.5.5" --jq length)"
          test "$refs" = "0"
          echo "v0.5.5 release and tag removed; v0.5.4 is latest."
